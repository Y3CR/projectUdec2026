{% extends "base.html" %}
{% block title %}Nueva Solicitud — UCundinamarca{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('prestamos.mis_solicitudes') }}" class="btn btn-outline-secondary btn-sm me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h2 class="fw-bold mb-0">
                    <i class="bi bi-plus-circle me-2 text-ucundi"></i>Nueva Solicitud
                </h2>
                <p class="text-muted small mb-0">HU-9 / HU-10: Solicitar préstamo de espacio o recurso</p>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="POST" novalidate id="formSolicitud">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3">

                        <!-- Tipo -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small">Tipo de solicitud *</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="tipo"
                                        id="tipoEspacio" value="espacio"
                                        {% if data.get('tipo') == 'espacio' %}checked{% endif %}
                                        onchange="toggleTipo()">
                                    <label class="form-check-label" for="tipoEspacio">
                                        <i class="bi bi-door-open me-1"></i>Espacio físico
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="tipo"
                                        id="tipoRecurso" value="recurso"
                                        {% if data.get('tipo') == 'recurso' %}checked{% endif %}
                                        onchange="toggleTipo()">
                                    <label class="form-check-label" for="tipoRecurso">
                                        <i class="bi bi-laptop me-1"></i>Recurso físico
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Selector espacio -->
                        <div class="col-12" id="selectorEspacio" style="display:none;">
                            <label class="form-label fw-semibold small">Espacio *</label>
                            <select class="form-select" name="espacio_id">
                                <option value="">— Selecciona un espacio —</option>
                                {% for espacio in espacios %}
                                <option value="{{ espacio.id }}"
                                    {% if data.get('espacio_id') and data.get('espacio_id')|int == espacio.id %}selected{% endif %}>
                                    {{ espacio.nombre }} ({{ espacio.tipo.nombre }}) — Cap: {{ espacio.capacidad }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Selector recurso -->
                        <div class="col-12" id="selectorRecurso" style="display:none;">
                            <label class="form-label fw-semibold small">Recurso *</label>
                            <select class="form-select" name="recurso_id">
                                <option value="">— Selecciona un recurso —</option>
                                {% for recurso in recursos %}
                                <option value="{{ recurso.id }}"
                                    {% if data.get('recurso_id') and data.get('recurso_id')|int == recurso.id %}selected{% endif %}>
                                    {{ recurso.nombre }} ({{ recurso.categoria.nombre }}) — Disponibles: {{ recurso.cantidad_disponible }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Fechas -->
                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Fecha y hora de inicio *</label>
                            <input type="datetime-local" class="form-control" name="fecha_inicio"
                                value="{{ data.get('fecha_inicio', '') }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold small">Fecha y hora de fin *</label>
                            <input type="datetime-local" class="form-control" name="fecha_fin"
                                value="{{ data.get('fecha_fin', '') }}" required>
                        </div>

                        <!-- Motivo -->
                        <div class="col-12">
                            <label class="form-label fw-semibold small">Motivo o descripción del uso</label>
                            <textarea class="form-control" name="motivo" rows="3"
                                placeholder="Describe brevemente el uso que darás al espacio o recurso...">{{ data.get('motivo', '') }}</textarea>
                        </div>

                    </div>

                    <hr class="my-4">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-ucundi px-4">
                            <i class="bi bi-send me-1"></i>Enviar solicitud
                        </button>
                        <a href="{{ url_for('prestamos.mis_solicitudes') }}" class="btn btn-outline-secondary px-4">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleTipo() {
        const esEspacio = document.getElementById('tipoEspacio').checked;
        document.getElementById('selectorEspacio').style.display = esEspacio ? 'block' : 'none';
        document.getElementById('selectorRecurso').style.display = esEspacio ? 'none' : 'block';
    }
    // Inicializar al cargar
    toggleTipo();
</script>
{% endblock %}
