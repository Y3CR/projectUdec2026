<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta — {{ recurso.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <style>
        body { background: #f5f7fa; }
        .etiqueta {
            width: 9cm; min-height: 6cm;
            border: 2px solid #1b4332; border-radius: 10px;
            padding: 16px; background: white;
        }
        .etiqueta-header {
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .etiqueta-logo { width: 32px; height: 32px; object-fit: contain; }
        .etiqueta-inst {
            font-size: 8px; color: #666;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .etiqueta-nombre { font-size: 13px; font-weight: 700; color: #1b4332; }
        .etiqueta-dato { font-size: 10px; color: #444; margin-bottom: 2px; }
        .etiqueta-codigo {
            font-family: 'Courier New', monospace; font-size: 11px;
            font-weight: 600; background: #f0f0f0;
            padding: 2px 6px; border-radius: 4px;
        }
        .etiqueta-qr img { width: 100px; height: 100px; }
        @media print {
            body { background: white; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="p-4">

    <div class="no-print mb-3 d-flex gap-2">
        <button onclick="window.print()" class="btn btn-success">
            <i class="bi bi-printer me-1"></i>Imprimir etiqueta
        </button>
        <a href="{{ url_for('operador.recurso_qr_imagen', recurso_id=recurso.id) }}"
           download="qr_{{ recurso.codigo_interno }}.png"
           class="btn btn-outline-success">
            <i class="bi bi-download me-1"></i>Descargar QR
        </a>
        <a href="{{ url_for('operador.recursos') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Volver
        </a>
    </div>

    <div class="d-flex justify-content-center">
        <div class="etiqueta shadow-sm">
            <div class="etiqueta-header">
                <img src="{{ url_for('static', filename='img/escudo.png') }}"
                     alt="UCundinamarca" class="etiqueta-logo">
                <div>
                    <div class="etiqueta-inst">Universidad de Cundinamarca</div>
                    <div class="etiqueta-inst">Sistema de Préstamos · Ext. Facatativá</div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-start">
                <div style="flex:1;padding-right:10px;">
                    <div class="etiqueta-nombre mb-1">{{ recurso.nombre }}</div>
                    <div class="etiqueta-dato">
                        Cat: <strong>{{ recurso.categoria.nombre }}</strong>
                    </div>
                    <div class="etiqueta-dato mt-1">
                        Código:
                        <span class="etiqueta-codigo">{{ recurso.codigo_interno or '—' }}</span>
                    </div>
                    <div class="etiqueta-dato mt-1">
                        Serial:
                        <span class="etiqueta-codigo">{{ recurso.serial or '—' }}</span>
                    </div>
                    <div class="etiqueta-dato mt-2" style="font-size:9px;color:#888;">
                        Escanea el QR para solicitar
                    </div>
                </div>
                <div class="etiqueta-qr">
                    <img src="{{ url_for('operador.recurso_qr_imagen', recurso_id=recurso.id) }}"
                         alt="QR">
                </div>
            </div>

            <!-- Código de barras del serial -->
            <div class="text-center mt-2">
                <svg id="barcode"></svg>
                <div style="font-size:9px;color:#666;margin-top:2px;">
                    {{ recurso.serial or '' }}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
        {% if recurso.serial %}
        JsBarcode("#barcode", "{{ recurso.serial }}", {
            format: "CODE128", width: 2, height: 40,
            displayValue: false, margin: 0, lineColor: "#1b4332"
        });
        {% endif %}
    </script>
</body>
</html>
